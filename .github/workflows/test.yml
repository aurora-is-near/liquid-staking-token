name: Test
on:
  push:
    branches:
      - master
      - main
  pull_request:

jobs:
  code-formatting:
    name: Code Formatting
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
      - name: Setup Rust cache
        uses: Swatinem/rust-cache@v2
      - run: cargo fmt --check

  code-linter:
    name: Code Linter
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
      - name: Setup Rust cache
        uses: Swatinem/rust-cache@v2
      - name: Run cargo clippy
        run: |
          rustup component add clippy
          cargo clippy --all-features --all-targets --workspace

  tests:
    name: Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
      - name: Setup Rust cache
        uses: Swatinem/rust-cache@v2
      - name: Install cargo-near CLI and cargo-nextest
        run: |
          curl --proto '=https' --tlsv1.2 -LsSf https://github.com/near/cargo-near/releases/download/cargo-near-v0.20.0/cargo-near-installer.sh | sh
          curl -LsSf https://get.nexte.st/0.9/linux | tar zxf - -C ${CARGO_HOME:-~/.cargo}/bin
      - name: Run tests
        run: cargo nextest run --test-threads 4 --no-fail-fast
